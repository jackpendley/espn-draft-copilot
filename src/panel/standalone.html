<meta charset="utf-8">
<title>Draft Copilot — standalone board</title>
<link rel="stylesheet" href="panel.css">
<style>
  body { margin: 0; background: #eef1f5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 620px; margin: 0 auto; padding: 16px; }
  .note { font-size: 12px; color: #4b5563; padding: 10px 14px; background: #fff6e0; border-left: 3px solid #c99700; border-radius: 5px; margin-bottom: 14px; }
  /* Un-fix the shell so it flows in this page instead of floating over ESPN. */
  #draft-copilot-root { position: static; }
  .dc-shell { position: static !important; width: 100%; max-height: none; box-shadow: 0 2px 12px rgba(0,0,0,.1); }
  .dc-panel { max-height: none; }
  .dc-header { cursor: default; }
  .dc-list { max-height: 62vh; }
</style>
<div class="wrap">
  <div class="note">
    <strong>Standalone mode.</strong> Same board, not injected into ESPN's page. Use this if the
    in-page panel ever fails during a draft — it still syncs picks from ESPN's API, so keep the
    draft room open in another window and draft there.
  </div>
  <div id="draft-copilot-root"><div class="dc-shell"></div></div>
</div>
<script type="module" src="standalone.js"></script>
